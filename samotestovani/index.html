<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Samotestování – příprava na písemné testy</title>
<style>
  :root{--ink:#1d2433;--muted:#5b6476;--line:#d9dee8;--bg:#f4f6fa;--card:#fff;--acc:#1f5fbf;--ok:#1e8a4c;--bad:#c0392b;--warn:#d98e04;--fs:17px}
  *{box-sizing:border-box}
  body{margin:0;font-family:"Atkinson Hyperlegible","Segoe UI",Arial,sans-serif;font-size:var(--fs);color:var(--ink);background:var(--bg);line-height:1.45}
  body.velke{--fs:21px} body.nejvetsi{--fs:25px}
  .wrap{max-width:820px;margin:0 auto;padding:12px 14px 40px}
  header.top{background:var(--acc);color:#fff;padding:8px 14px;display:flex;gap:10px;align-items:center;position:sticky;top:0;z-index:5}
  header.top b{font-size:1em} header.top .sp{flex:1}
  header.top button{background:#fff;color:var(--acc);border:0;border-radius:6px;padding:5px 10px;font-weight:700;cursor:pointer;font-size:.9em}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:12px 0}
  .ukol{border:3px solid var(--acc);border-radius:10px;padding:8px 14px;background:#eef4ff;margin:12px 0}
  .ukol p{margin:3px 0} .ukol.mal{border-width:2px;font-size:.92em}
  h1{font-size:1.35em;margin:6px 0 8px}
  h2{font-size:1.1em;margin:0 0 8px;display:flex;justify-content:space-between;gap:10px}
  h2 .b{white-space:nowrap;background:#eef4ff;color:var(--acc);border-radius:6px;padding:1px 8px}
  .rezim{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
  .rezim button{border:3px solid var(--line);background:#fff;border-radius:12px;padding:12px 6px;font-size:1.05em;cursor:pointer;color:var(--ink)}
  .rezim button small{color:var(--muted);font-size:.75em}
  .rezim button.sel{border-color:var(--acc);background:#eef4ff}
  .tema{display:flex;align-items:center;gap:10px;padding:8px 6px;border-top:1px solid var(--line);cursor:pointer}
  .tema:first-of-type{border-top:0} .tema input{transform:scale(1.4)}
  .tema:not(.on){opacity:.5}
  .tn{font-weight:800;background:var(--acc);color:#fff;border-radius:50%;min-width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center}
  .tt{flex:1;font-size:.95em} .tp{font-weight:700;min-width:46px;text-align:right}
  .bar{display:block;height:8px;background:#e6ebf3;border-radius:5px;margin-top:4px;overflow:hidden} .bar i{display:block;height:100%}
  .kolo{height:8px;background:#dfe5ef;border-radius:5px;overflow:hidden;margin-top:4px} .kolo i{display:block;height:100%;background:var(--acc)}
  .ust{font-size:.8em;color:var(--muted);margin-bottom:6px}
  .pozn{background:#f7f9fc;border-left:4px solid var(--acc);padding:6px 10px;border-radius:4px}
  .pol{margin:12px 0 4px}
  .q{font-weight:600;margin-bottom:6px;font-size:1.05em}
  .opt{display:block;border:2px solid var(--line);border-radius:10px;padding:10px 12px;margin:7px 0;cursor:pointer;background:#fff}
  .opt.sel{border-color:var(--acc);background:#eef4ff}
  .opt.good{border-color:var(--ok);background:#e9f7ef}
  .opt.wrong{border-color:var(--bad);background:#fdecea}
  .opt input{margin-right:8px;transform:scale(1.25)}
  .lbl{font-weight:800;color:var(--acc);margin-right:6px}
  table.rows{border-collapse:collapse;width:100%}
  table.rows td{border-top:1px solid var(--line);padding:8px 5px;vertical-align:middle}
  table.rows tr:first-child td{border-top:0}
  td.w50{width:50%} td.an{white-space:nowrap}
  .an button{min-width:56px;padding:7px 10px;border:2px solid var(--line);border-radius:8px;background:#fff;cursor:pointer;font-size:.95em;font-weight:700;margin-right:4px}
  .an button.sel{border-color:var(--acc);background:var(--acc);color:#fff}
  select{font-size:.95em;padding:7px 8px;border:2px solid var(--line);border-radius:8px;background:#fff;max-width:100%;width:100%}
  .dopl select{width:auto;margin:2px 0} select.done{border-color:var(--acc)}
  input.num{font-size:1em;padding:7px 8px;width:110px;border:2px solid var(--line);border-radius:8px}
  input.txt{font-size:1em;padding:7px 8px;width:100%;border:2px solid var(--line);border-radius:8px}
  textarea{width:100%;font:inherit;padding:8px;border:2px solid var(--line);border-radius:8px}
  .radek{margin:6px 0;display:flex;gap:6px;align-items:center} .radek input,.radek select{flex:1}
  .rowimg{max-width:200px;max-height:160px;border:1px solid var(--line);border-radius:6px;display:block}
  .imgs{display:flex;gap:14px;flex-wrap:wrap;margin:8px 0} .imgs figure{margin:0;text-align:center} .imgs figcaption{font-weight:700;margin-top:4px}
  .obr{margin:8px 0;overflow-x:auto}
  .dopl{line-height:2.5} .gap{font-weight:800;color:var(--acc);font-size:.85em}
  .btn{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:11px 20px;font-size:1.05em;font-weight:700;cursor:pointer}
  .btn:disabled{opacity:.4}
  .btn.sec{background:#fff;color:var(--acc);border:2px solid var(--acc)}
  .btn.velky{font-size:1.15em;padding:14px 26px} .btn.mini{font-size:.85em;padding:6px 12px}
  .tl{text-align:center;margin:16px 0 4px}
  .muted{color:var(--muted)} .big{font-size:2.4em;font-weight:800;color:var(--acc);margin:4px 0}
  table.tab{border-collapse:collapse;width:100%;font-size:.92em}
  table.tab th,table.tab td{border:1px solid var(--line);padding:5px 7px;text-align:left}
  table.tab th{background:#eef2f8}
  table.grid{border-collapse:collapse;margin-top:4px}
  table.grid td{border:1.5px solid #333;width:58px;height:54px;text-align:center;vertical-align:middle}
  table.grid td.dole{border-top:1.5px dashed #888}
  table.grid input{width:44px;text-align:center;padding:4px}
  table.grid td.g-ok{background:#e9f7ef} table.grid td.g-bad{background:#fdecea}
  .znak{font-weight:800;margin-left:6px} .znak.ok{color:var(--ok)} .znak.bad{color:var(--bad)} .znak.pul{color:var(--warn)}
  .corr{font-size:.88em;color:var(--ok);font-weight:700}
  .verdikt{margin:16px 0 6px;padding:12px 14px;border-radius:10px;font-size:1.15em;font-weight:800;text-align:center}
  .verdikt.ok{background:#e9f7ef;color:var(--ok);border:2px solid var(--ok)}
  .verdikt.pul{background:#fff6e0;color:#8a5a00;border:2px solid var(--warn)}
  .verdikt.ne{background:#fdecea;color:var(--bad);border:2px solid var(--bad)}
  .postup,.vzor{background:#f3f7ff;border:2px dashed var(--acc);border-radius:10px;padding:10px 12px;margin:10px 0}
  .klice{margin:8px 0} .hint{background:#fff6e0;border:2px solid var(--warn);border-radius:8px;padding:6px 10px;margin-bottom:6px}
  @media(max-width:600px){.rowimg{max-width:140px}td.w50{width:55%}table.grid td{width:44px;height:46px}table.grid input{width:36px;font-size:.9em}}
</style>
</head>
<body>
<header class="top">
  <a href="../" style="color:#fff;text-decoration:none"><b>⬅ Písemné testy</b></a><span id="hInfo"></span><span class="sp"></span>
  <button onclick="velikost()" id="bFs" title="Velikost písma">A+</button>
  <button onclick="if(!KOLA||confirm('Ukončit kolo a jít domů?'))domu()" title="Domů">🏠</button>
</header>

function svgOsnova(){
  const L=[[98,'1'],[121,'2'],[146,'3'],[200,'4'],[226,'5']];
  let s='<svg viewBox="0 0 470 250" width="440" style="max-width:100%;background:#fff;border:1px solid #d9dee8;border-radius:6px">';
  L.forEach(([y,n])=>{s+=`<line x1="20" y1="${y}" x2="430" y2="${y}" stroke="#333" stroke-width="1.2"/><text x="445" y="${y+5}" font-size="15" font-family="Arial" font-weight="bold">${n}</text>`});
  s+='<g font-family="Times New Roman,Times,serif" fill="#111">';
  s+='<text x="30" y="200" font-size="120">Á</text>';
  s+='<text x="125" y="200" font-size="120">a</text>';
  s+='<text x="195" y="200" font-size="81">A</text>';
  s+='<text x="262" y="200" font-size="120">p</text>';
  s+='</g></svg>';
  return s;
}
function svgSpad(){
  const one=(spad,lab)=>{
    let s=`<figure><svg viewBox="0 0 200 250" width="180" style="background:#fff">`;
    if(spad){
      s+=`<rect x="10" y="10" width="180" height="230" fill="#5aa0d8"/>`;
      s+=`<rect x="22" y="22" width="156" height="206" fill="none" stroke="#111" stroke-width="2"/>`;
      s+=`<rect x="10" y="10" width="180" height="230" fill="none" stroke="#c0392b" stroke-dasharray="6 4" stroke-width="1.5"/>`;
      s+=`<circle cx="100" cy="110" r="38" fill="#f4d35e"/><path d="M10 200 Q70 150 120 190 T190 175 V240 H10Z" fill="#2e7d32"/>`;
    }else{
      s+=`<rect x="22" y="22" width="156" height="206" fill="#fff" stroke="#111" stroke-width="2"/>`;
      s+=`<rect x="42" y="42" width="116" height="150" fill="#5aa0d8"/><circle cx="100" cy="100" r="26" fill="#f4d35e"/><path d="M42 170 Q80 140 110 165 T158 158 V192 H42Z" fill="#2e7d32"/>`;
      s+=`<rect x="52" y="202" width="96" height="8" fill="#888"/>`;
    }

  };
  return `<div class="imgs">${one(true,'Obrázek A')}${one(false,'Obrázek B')}</div><p class="muted" style="font-size:.85em">Černá čára = okraj hotové tiskoviny po ořezu. Červená přerušovaná = okraj tisku.</p>`;
}

function svgPlan(){ // montážní plán letáku A5 na B2, na obrátku

  s+=`<text x="${X+e/2}" y="${Y+f+ch}" font-size="14" text-anchor="middle" fill="#1f5fbf" font-weight="bold">E</text><text x="${X+W-e/2}" y="${Y+f+ch}" font-size="14" text-anchor="middle" fill="#1f5fbf" font-weight="bold">E</text>`;

}

{id:"2-11", o:2, t:"grid", gen:r=>{
  const st=pick([48,64,80],r), pocet=st/16, k=1+Math.floor(r()*Math.min(pocet,3)), d=16*(k-1);
  const L=[[5,12,9,8],[4,13,16,1]], R=[[7,10,11,6],[2,15,14,3]];
  const add=g=>g.map(row=>row.map(v=>v+d));
  const rows=[];for(let i=1;i<=pocet;i++)rows.push([i+". TA",16*(i-1)+1,16*i]);
  return {pozn:`Časopis ve vazbě <b>V2</b> má <b>${st} stran</b>. Na jeden tiskový arch (TA) se vejde <b>16 stran</b>. Zjisti počet TA, rozepiš je a vyřaď <b>${k}. TA</b>.`,
    cisla:[["Počet TA =",pocet,0.01,""]],
    tab:{h0:"tiskový arch",cols:["od strany","do strany"],r:rows},
    g:[[k+". TA LÍC",add(L)],[k+". TA RUB",add(R)]],
    postup:`${st} : 16 = <b>${pocet} TA</b>. Každý TA má 16 stran za sebou: 1. TA = 1–16, 2. TA = 17–32…<br>`+
      (k>1?`${k}. TA má stejné rozmístění jako 1. TA – jen ke každému číslu přičti <b>${d}</b>.<br>`:'')+
      `Horní řada se píše vzhůru nohama. Kontrola: dvojice stran vedle sebe dává vždy součet <b>${17+2*d}</b> (např. ${1+d} + ${16+d}).`}}},

{id:"4-09", o:4, t:"cisla", gen:r=>{

   postup:`1 TA = 0,5 m × 0,707 m = 0,3535 m²<br>Všechny TA: ${n.toLocaleString('cs-CZ')} × 0,3535 = ${cz(n*0.3535)} m²<br>Hmotnost: ${cz(n*0.3535)} × ${g} g = ${cz(n*0.3535*g)} g = <b>${cz(kg)} kg</b><br>Cena: ${cz(kg)} × ${c} Kč = <b>${cz(Math.round(kc*100)/100)} Kč</b>`}}},

{id:"5-10", o:5, t:"cisla", gen:r=>{
  const F=pick([
    {f:"A5",w:148,h:210,c:4,rw:2},
    {f:"A4",w:297,h:210,c:2,rw:2},
    {f:"A6",w:105,h:148,c:6,rw:3}],r);
  const E=(707-F.c*F.w)/2, Fz=500-15-F.rw*F.h, ks=F.c*F.rw;
  const all=[];for(let i=1;i<=ks;i++){const col=(i-1)%F.c;all.push([String(i),col<F.c/2?"líc":"rub"])}
  const lr=ks>8?shuffle(all,r).slice(0,6).sort((a,b)=>a[0]-b[0]):all;
  return {pozn:`Montážní plán tiskového archu pro leták <b>bez spadávky</b>: čistý formát <b>${F.f}</b>, formát TA <b>B2 (A = 500 mm, B = 707 mm)</b>, čelní náložka <b>15 mm</b>. Tiskne se z jedné formy <b>na obrátku</b>. Urči rozměry letáku (C, D), zbytky (E, F) a jestli jde o líc, nebo rub.`,
   html:()=>svgPlanG(F), r:[["C =",F.h,0.01,"mm"],["D =",F.w,0.01,"mm"],["E =",E,0.01,"mm"],["F =",Fz,0.01,"mm"]],
   lr, postup:`${F.f} = ${F.w} × ${F.h} mm → C = ${F.h}, D = ${F.w}<br>Šířka archu: ${F.c} × ${F.w} = ${F.c*F.w} mm → 707 − ${F.c*F.w} = ${707-F.c*F.w} → E = ${707-F.c*F.w} : 2 = <b>${cz(E)} mm</b><br>Výška: 500 − 15 (náložka) = 485 → ${F.rw} × ${F.h} = ${F.rw*F.h} → F = 485 − ${F.rw*F.h} = <b>${cz(Fz)} mm</b><br>Obrátka: levá polovina archu = líc, pravá = rub.`}}},

  const L=shuffle([60,80,100,120,150,175,200],r).slice(0,3).sort((a,b)=>a-b);

/* =====================================================================

   ===================================================================== */
const KLIC = "samotest-pzk-1-8";   // ukládání postupu v prohlížeči žáka
const KOLO = 10;                    // otázek v jednom kole

/* ---------- montážní plán pro různé formáty ---------- */
function svgPlanG(F){
  const E=(707-F.c*F.w)/2, Fz=500-15-F.rw*F.h;
  let s='<svg viewBox="0 0 560 360" width="520" style="max-width:100%;background:#fff;border:1px solid #d9dee8;border-radius:6px" font-family="Arial">';
  const X=50,Y=40,W=440,k=W/707,H=500*k; const cw=F.w*k, ch=F.h*k, e=E*k, f=Fz*k, nal=15*k;
  s+=`<rect x="${X}" y="${Y}" width="${W}" height="${H}" fill="#fafafa" stroke="#333" stroke-width="2"/>`;
  s+=`<rect x="${X}" y="${Y+H-nal}" width="${W}" height="${nal}" fill="#e6ecf5"/><text x="${X+6}" y="${Y+H-2}" font-size="9" fill="#555">náložka 15 mm</text>`;
  const fs=F.c>4?13:18;
  for(let r=0;r<F.rw;r++)for(let c=0;c<F.c;c++){const x=X+e+c*cw,y=Y+f+r*ch;
    s+=`<rect x="${x}" y="${y}" width="${cw}" height="${ch}" fill="#fff" stroke="#111"/><text x="${x+cw/2}" y="${y+ch/2+6}" font-size="${fs}" text-anchor="middle" font-weight="bold">${r*F.c+c+1}</text>`;}
  const x2=X+e+cw,y2=Y+f; s+=`<rect x="${x2}" y="${y2}" width="${cw}" height="${ch}" fill="none" stroke="#c0392b" stroke-width="3"/>`;
  s+=`<text x="${x2-12}" y="${y2+ch/2}" font-size="14" fill="#c0392b" font-weight="bold">C</text><text x="${x2+cw/2-5}" y="${y2+ch+14}" font-size="14" fill="#c0392b" font-weight="bold">D</text>`;
  s+=`<line x1="${X+W/2}" y1="${Y-8}" x2="${X+W/2}" y2="${Y+H+8}" stroke="#1f5fbf" stroke-dasharray="6 4" stroke-width="1.5"/>`;
  s+=`<text x="${X+W/2}" y="${Y-14}" font-size="15" text-anchor="middle" font-weight="bold">B = 707 mm</text>`;
  s+=`<text x="${X-30}" y="${Y+H/2}" font-size="15" font-weight="bold" transform="rotate(-90 ${X-30} ${Y+H/2})" text-anchor="middle">A = 500 mm</text>`;
  const ey=Y+f+ch*Math.min(F.rw,2)/2+5;
  s+=`<text x="${X+e/2}" y="${ey}" font-size="14" text-anchor="middle" fill="#1f5fbf" font-weight="bold">E</text><text x="${X+W-e/2}" y="${ey}" font-size="14" text-anchor="middle" fill="#1f5fbf" font-weight="bold">E</text>`;
  s+=`<text x="${X+W*0.75}" y="${Y+f/2+5}" font-size="14" text-anchor="middle" fill="#1f5fbf" font-weight="bold">F</text>`;
  s+=`<text x="${X+W+8}" y="${Y+H/2}" font-size="10" fill="#1f5fbf">osa</text><text x="${X+W+8}" y="${Y+H/2+12}" font-size="10" fill="#1f5fbf">obrátky</text>`;
  return s+'</svg>';
}

/* ---------- pomocné funkce ---------- */
function shuffle(arr,r){r=r||Math.random;const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=x=>(Math.round(x*100)/100).toString().replace('.',',');
const uniq=a=>[...new Set(a)];
function norm(t){return String(t||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,' ').trim()}
function lev(a,b){const m=a.length,n=b.length;const d=Array.from({length:m+1},(_,i)=>[i]);for(let j=1;j<=n;j++)d[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n]}
// tolerantní porovnání: bez diakritiky, velikosti písmen; u delších slov uzná 1 překlep
function shoda(txt,keys,excl){const t=norm(txt);if(!t)return false;const w=t.split(' ');
  if(excl&&excl.some(e=>t.includes(norm(e))))return false;
  const jeden=st=>{if(t.includes(st))return true;if(st.includes(' ')||st.length<5)return false;
    return w.some(x=>x.length>=st.length-1&&lev(x.slice(0,st.length),st)<=1)};
  return keys.some(k=>k.includes('+')?k.split('+').every(x=>jeden(norm(x))):jeden(norm(k)))}
function napisNOk(s,pocet,a){const used=new Set();const res=[];for(let i=0;i<pocet;i++){let ok=-1;
  for(let k=0;k<s.length;k++){if(!used.has(k)&&shoda(a[i],s[k][1],s[k][2])){ok=k;break}}
  if(ok>=0)used.add(ok);res.push(ok>=0)}return res}
function numParse(v){if(v==null||v==='')return NaN;return parseFloat(String(v).replace(/\s/g,'').replace(',','.').replace(/[^0-9.\-]/g,''))}

/* ---------- uložený postup ---------- */
let S=(()=>{try{return JSON.parse(localStorage.getItem(KLIC))}catch(e){return null}})()||{};
S.p=S.p||{}; S.n=S.n||0; S.rezim=S.rezim||'psat'; S.temata=S.temata||[1,2,3,4,5,6,7,8]; S.fs=S.fs||0;
function ulozit(){try{localStorage.setItem(KLIC,JSON.stringify(S))}catch(e){}}

const vidi=it=>it.jen?(it.jen===S.rezim):!(it.t==='vysvetli'&&S.rezim==='vyber');
const polozkyTematu=o=>BANKA.filter(it=>it.o===o&&vidi(it));
function umim(o){const L=polozkyTematu(o);if(!L.length)return 0;return Math.round(L.reduce((a,it)=>a+Math.min((S.p[it.id]||{}).b||0,4),0)/(4*L.length)*100)}

/* ---------- výběr otázek podle toho, jak je žák umí ---------- */
function vaha(it){const p=S.p[it.id];if(!p)return 4;
  const w=[8,8,4,2,1,0.4][p.b]||1; const age=S.n-(p.last||0);
  return w*(age<4?0.1:1)*(1+Math.min(age,40)/10)}
function sestavKolo(){
  let pool=BANKA.filter(it=>vidi(it)&&S.temata.includes(it.o)); const out=[];
  while(out.length<KOLO&&pool.length){const W=pool.map(vaha);let x=Math.random()*W.reduce((a,b)=>a+b,0);
    let i=0;for(;i<pool.length-1;i++){x-=W[i];if(x<=0)break}
    out.push({it:pool[i]});pool.splice(i,1)}
  return out;
}

/* ---------- příprava jedné otázky ---------- */
let lastPos=-1;
function pripravit(item){
  const r=Math.random; const d=Object.assign({},item); if(item.gen)Object.assign(d,item.gen(r));
  const parts=[];
  if(d.t==='grid'){
    if(d.cisla)parts.push({k:'cisla',r:d.cisla});
    if(d.tab)parts.push(Object.assign({k:'tabcis',fix:true,q:'<b>Rozpis TA</b> – od které do které strany:'},d.tab));
    parts.push({k:'grid',g:d.g,q:'<b>Vyřazení</b> – doplň čísla stran (horní řada se píše vzhůru nohama).'});
  } else {
    const p=Object.assign({},d,{k:d.t}); delete p.html; parts.push(p);
    if(d.lr)parts.push({k:'prirad',q:'Je leták <b>líc</b>, nebo <b>rub</b>?',r:d.lr,nabFix:['líc','rub']});
  }
  parts.forEach(p=>{
    const idx=n=>[...Array(n).keys()];
    if(p.k==='vyber'){let ord=shuffle(idx(p.o_.length),r);let pos=ord.indexOf(0);
      if(pos===lastPos){const j=(pos+1+Math.floor(r()*(ord.length-1)))%ord.length;[ord[pos],ord[j]]=[ord[j],ord[pos]];pos=j}
      lastPos=pos;p.ord=ord}
    if(['anone','prirad','napis','cisla'].includes(p.k)){let rows=idx(p.r.length);
      if(p.k!=='cisla'||p.vzorek)rows=shuffle(rows,r);
      if(p.vzorek&&p.vzorek<rows.length)rows=rows.slice(0,p.vzorek);
      if(p.k==='cisla'&&!p.vzorek)rows=idx(p.r.length);
      if(p.k==='prirad'&&rows.length>=3&&rows.every((x,i)=>x===i))rows.push(rows.shift());
      p.rows=rows}
    if(p.k==='prirad')p.nab=p.nabFix||shuffle(uniq(p.r.map(x=>x[1]).concat(p.n||[])),r);
    if(p.k==='napis')p.nab=shuffle(uniq(p.r.map(x=>x[1]).concat(p.n||[])),r);
    if(p.k==='napisN')p.nab=shuffle(uniq(p.s.map(x=>x[0]).concat(p.n||[])),r);
    if(p.k==='dopln')p.nab=shuffle(uniq(p.a.concat(p.n||[])),r);
    if(p.k==='doplnV')p.nab=p.o_.map(a=>shuffle(a,r));
    if(p.k==='vice')p.ord=shuffle(idx(p.o_.length),r);
    if(p.k==='tabcis')p.rows=p.fix?idx(p.r.length):shuffle(idx(p.r.length),r);
  });
  const lzeNapovedet=S.rezim==='psat'&&parts.some(p=>(p.k==='napis')||(p.k==='napisN'&&(p.n||[]).length)||p.k==='vysvetli');
  return {item,d,parts,A:parts.map(()=>({})),hint:false,res:null,lzeNapovedet};
}

/* ---------- hodnocení ---------- */
function hodnotit(Q){
  return Q.parts.map((p,pi)=>{const a=Q.A[pi]; const m={}; let got=0,max=0;
    const zavr=S.rezim==='vyber'||Q.hint;
    if(p.k==='vyber'){max=1;m.v=a.v===0;got=m.v?1:0}
    if(p.k==='anone'){p.rows.forEach(i=>{max++;m[i]=a[i]===p.r[i][1];if(m[i])got++})}
    if(p.k==='prirad'){p.rows.forEach(i=>{max++;m[i]=a[i]!=null&&a[i]===p.r[i][1];if(m[i])got++})}
    if(p.k==='dopln'){p.a.forEach((x,i)=>{max++;m[i]=a[i]===x;if(m[i])got++})}
    if(p.k==='doplnV'){p.o_.forEach((x,i)=>{max++;m[i]=a[i]===x[0];if(m[i])got++})}
    if(p.k==='vice'){let c=0,w=0;p.o_.forEach((o,i)=>{if(a[i]){o[1]?c++:w++}});max=p.max;got=Math.max(0,Math.min(p.max,c)-w)}
    if(p.k==='napis'){p.rows.forEach(i=>{max++;const row=p.r[i];m[i]=zavr?a[i]===row[1]:shoda(a[i],row[2],row[3]);if(m[i])got++})}
    if(p.k==='napisN'){let ok;if(zavr){const used=new Set();ok=[];for(let i=0;i<p.pocet;i++){const k=p.s.findIndex((x,ki)=>!used.has(ki)&&x[0]===a[i]);if(k>=0)used.add(k);ok.push(k>=0)}}
      else ok=napisNOk(p.s,p.pocet,a);ok.forEach((x,i)=>{max++;m[i]=x;if(x)got++})}
    if(p.k==='cisla'){p.rows.forEach(i=>{max++;const row=p.r[i];const n=numParse(a[i]);m[i]=!isNaN(n)&&Math.abs(n-row[1])<=row[2];if(m[i])got++})}
    if(p.k==='tabcis'){p.rows.forEach(i=>p.cols.forEach((c,ci)=>{max++;const n=numParse(a[i+'_'+ci]);const k=i+'_'+ci;m[k]=!isNaN(n)&&Math.abs(n-p.r[i][ci+1])<0.001;if(m[k])got++}))}
    if(p.k==='grid'){p.g.forEach((gr,gi)=>gr[1].forEach((row,r)=>row.forEach((v,c)=>{max++;const k=gi+'_'+r+'_'+c;m[k]=numParse(a[k])===v;if(m[k])got++})))}
    if(p.k==='vysvetli'){const K=p.klice;K.forEach((x,i)=>{max++;m[i]=shoda(a.t,x[1]);if(m[i])got++})}
    return {got,max,m};
  });
}

/* ---------- vykreslení ---------- */
const app=document.getElementById('app');
let KOLA=null; // {fronta:[], i, vysl:[]}
let Q=null;

function hlavicka(t){document.getElementById('hInfo').innerHTML=t||''}

function domu(){
  KOLA=null;Q=null;hlavicka('');
  const celk=Math.round([1,2,3,4,5,6,7,8].reduce((a,o)=>a+umim(o),0)/8);
  let h=`<h1>Samotestování – příprava na písemné testy</h1>
  <div class="ukol"><p>1. Vyber <b>ústní otázky</b>.</p><p>2. Vyber, jestli <b>píšeš</b>, nebo <b>vybíráš</b>.</p><p>3. Klikni <b>Začít</b>.</p></div>
  <div class="rezim">
    <button class="${S.rezim==='psat'?'sel':''}" onclick="rezim('psat')">✍️<br><b>Píšu</b><br><small>odpovědi píšu sám/sama</small></button>
    <button class="${S.rezim==='vyber'?'sel':''}" onclick="rezim('vyber')">👆<br><b>Vybírám</b><br><small>vybírám z nabídky</small></button>
  </div>
  <div class="card"><h2><span>Co už umím</span><span class="b">${celk} %</span></h2>`;
  for(let o=1;o<=8;o++){const u=umim(o),on=S.temata.includes(o);
    h+=`<label class="tema ${on?'on':''}"><input type="checkbox" ${on?'checked':''} onchange="tema(${o},this.checked)">
      <span class="tn">${o}</span><span class="tt">${esc(TEMATA[o])}<span class="bar"><i style="width:${u}%;background:${u>=75?'var(--ok)':u>=40?'var(--warn)':'var(--acc)'}"></i></span></span><span class="tp">${u} %</span></label>`}
  h+=`<p style="margin:10px 0 0"><button class="btn sec mini" onclick="vse(true)">Vybrat vše</button> <button class="btn sec mini" onclick="vse(false)">Zrušit výběr</button></p></div>
  <button class="btn velky" onclick="zacit()" ${S.temata.length?'':'disabled'}>▶ Začít – ${KOLO} otázek</button>
  <div class="ukol mal"><p>Co <b>umíš</b>, přijde <b>méně často</b>.</p><p>Co <b>neumíš</b>, přijde <b>znovu</b>.</p></div>
  <p class="muted" style="font-size:.8em;margin-top:24px">Postup se ukládá jen v tomto prohlížeči. <a href="#" onclick="smazat();return false">Smazat můj postup</a></p>`;
  app.innerHTML=h; scrollTo(0,0);
}
function rezim(r){S.rezim=r;ulozit();domu()}
function tema(o,on){S.temata=S.temata.filter(x=>x!==o);if(on)S.temata.push(o);S.temata.sort();ulozit();domu()}
function vse(on){S.temata=on?[1,2,3,4,5,6,7,8]:[];ulozit();domu()}
function smazat(){if(confirm('Smazat celý tvůj postup? Začneš od nuly.')){S.p={};S.n=0;ulozit();domu()}}

function zacit(){KOLA={fronta:sestavKolo(),i:0,vysl:[]};if(!KOLA.fronta.length){alert('Vyber aspoň jednu ústní otázku.');return}otazka()}

function otazka(){
  const f=KOLA.fronta[KOLA.i]; Q=pripravit(f.it); Q.opak=!!f.opak;
  kresli(); scrollTo(0,0);
}

function kresli(){
  const {d,parts,res}=Q; const it=Q.item;
  hlavicka(`Otázka ${KOLA.i+1} / ${KOLA.fronta.length}`);
  let h=`<div class="kolo"><i style="width:${(KOLA.i)/KOLA.fronta.length*100}%"></i></div>
  <div class="card otazka"><div class="ust">Ústní otázka ${it.o} · ${esc(TEMATA[it.o])}${Q.opak?' · <b>🔁 ještě jednou</b>':''}</div>`;
  if(d.pozn)h+=`<p class="pozn">${d.pozn}</p>`;
  if(d.html)h+=`<div class="obr">${d.html()}</div>`;
  parts.forEach((p,pi)=>{h+=`<div class="pol">${cast(p,pi,Q.A[pi],res?res[pi]:null)}</div>`});
  if(res){
    const got=res.reduce((a,x)=>a+x.got,0),max=res.reduce((a,x)=>a+x.max,0),fr=max?got/max:0;
    h+=`<div class="verdikt ${fr===1?'ok':fr>=0.5?'pul':'ne'}">${fr===1?'✔ Správně!':fr>=0.5?`◐ Skoro – správně ${fmt(got)} z ${max}`:`✘ Tohle si zopakuj – správně ${fmt(got)} z ${max}`}${Q.hint&&fr===1?' <small>(s nápovědou)</small>':''}</div>`;
    if(d.postup)h+=`<div class="postup"><b>Postup:</b><br>${d.postup}</div>`;
    h+=`<div class="tl"><button class="btn velky" onclick="dalsi()">Další ➜</button></div>`;
  } else {
    h+=`<div class="tl"><button class="btn velky" onclick="zkontrolovat()">Zkontrolovat</button>`;
    if(Q.lzeNapovedet&&!Q.hint)h+=` <button class="btn sec" onclick="napoveda()">💡 Nápověda</button>`;
    h+=`</div>`;
  }
  h+=`</div><p style="text-align:center"><button class="btn sec mini" onclick="if(confirm('Ukončit kolo?'))konec()">Ukončit kolo</button></p>`;
  app.innerHTML=h;
}

function ok(m,txt){return m?'<span class="znak ok">✔</span>':`<span class="znak bad">✘</span>${txt!=null?` <span class="corr">${txt}</span>`:''}`}

function cast(p,pi,a,R){
  const dis=R?'disabled':''; const zavr=S.rezim==='vyber'||Q.hint;
  let h=p.q?`<div class="q">${(zavr&&(p.k==='napis'||p.k==='napisN'))?p.q.replace(/Napiš/g,'Vyber').replace(/napiš/g,'vyber'):p.q}</div>`:'';
  const sel=(opts,val,on,extra)=>`<select ${dis} class="${val!=null&&val!==''?'done':''}" onchange="${on}">`+`<option value="">– vyber –</option>`+opts.map((x,i)=>`<option value="${i}" ${val===x?'selected':''}>${esc(x)}</option>`).join('')+`</select>`;
  if(p.k==='vyber'){
    p.ord.forEach((oi,k)=>{const s=a.v===oi;let c=s?'sel':'';if(R){if(oi===0)c+=' good';else if(s)c+=' wrong'}
      h+=`<label class="opt ${c}"><input type="radio" ${dis} name="r${pi}" ${s?'checked':''} onchange="setA(${pi},'v',${oi},1)"><span class="lbl">${'abcd'[k]})</span>${esc(p.o_[oi])}${R&&oi===0?' ✔':''}</label>`});
  }
  if(p.k==='anone'){
    h+=`<table class="rows">`;
    p.rows.forEach(i=>{const v=a[i];h+=`<tr><td>${esc(p.r[i][0])}</td><td class="an"><button ${dis} class="${v===true?'sel':''}" onclick="setA(${pi},${i},true,1)">ANO</button><button ${dis} class="${v===false?'sel':''}" onclick="setA(${pi},${i},false,1)">NE</button>${R?ok(R.m[i],p.r[i][1]?'ANO':'NE'):''}</td></tr>`});
    h+=`</table>`;
  }
  if(p.k==='prirad'){
    h+=`<table class="rows">`;
    p.rows.forEach(i=>{const row=p.r[i];h+=`<tr><td>${esc(row[0])}</td><td class="w50">${sel(p.nab,a[i],`setS(${pi},${i},this,'nab')`)}${R?ok(R.m[i],esc(row[1])):''}</td></tr>`});
    h+=`</table>`;
  }
  if(p.k==='dopln'||p.k==='doplnV'){
    let t=esc(p.text);
    t=t.replace(/\{(\d+)\}/g,(m0,n)=>{n=+n;const nab=p.k==='dopln'?p.nab:p.nab[n];const sp=p.k==='dopln'?p.a[n]:p.o_[n][0];
      return (p.k==='doplnV'?`<span class="gap">(${n+1})</span> `:'')+sel(nab,a[n],`setS(${pi},${n},this,${p.k==='dopln'?"'nab'":"'nab',"+n})`)+(R?ok(R.m[n],esc(sp)):'')});
    h+=`<div class="dopl">${t}</div>`;
  }
  if(p.k==='vice'){
    h+=`<div class="muted" style="font-size:.85em;margin-bottom:4px">Zaškrtni <b>${p.max}</b>.</div>`;
    p.ord.forEach(oi=>{const s=!!a[oi];let c=s?'sel':'';if(R){if(p.o_[oi][1])c+=' good';else if(s)c+=' wrong'}
      h+=`<label class="opt ${c}"><input type="checkbox" ${dis} ${s?'checked':''} onchange="setA(${pi},${oi},this.checked,1)">${esc(p.o_[oi][0])}${R&&p.o_[oi][1]?' ✔':''}</label>`});
  }
  if(p.k==='napis'){
    h+=`<table class="rows">`;
    p.rows.forEach((i,k)=>{const row=p.r[i];let left;
      if(typeof row[0]==='object'){left=`<span class="lbl">${k+1}.</span>`+(row[0].img?`<img class="rowimg" src="${IMG[row[0].img]}" alt="">`:svgPismo(row[0].svg))}else left=esc(row[0]);
      const v=a[i]; let inp;
      if(zavr)inp=sel(p.nab,v,`setS(${pi},${i},this,'nab')`);
      else inp=`<input ${dis} class="txt" value="${v?esc(v):''}" oninput="setT(${pi},${i},this.value)" placeholder="napiš" autocomplete="off" autocapitalize="off" spellcheck="false">`;
      h+=`<tr><td>${left}</td><td class="w50">${inp}${R?ok(R.m[i],esc(row[1])):''}</td></tr>`});
    h+=`</table>`;
  }
  if(p.k==='napisN'){
    for(let i=0;i<p.pocet;i++){const v=a[i];
      h+=`<div class="radek">${i+1}. `+(zavr?sel(p.nab,v,`setS(${pi},${i},this,'nab')`):`<input ${dis} class="txt" value="${v?esc(v):''}" oninput="setT(${pi},${i},this.value)" placeholder="napiš" autocomplete="off" autocapitalize="off" spellcheck="false">`)+(R?ok(R.m[i],null):'')+`</div>`}
    if(R)h+=`<div class="corr">Správně může být např.: ${esc(p.s.slice(0,8).map(x=>x[0]).join(', '))}${p.s.length>8?'…':''}</div>`;
  }
  if(p.k==='cisla'){
    h+=`<table class="rows">`;
    p.rows.forEach(i=>{const row=p.r[i];const v=a[i];
      h+=`<tr><td>${row[0]}</td><td class="w50"><input ${dis} class="num" inputmode="decimal" value="${v!=null?esc(v):''}" oninput="setT(${pi},${i},this.value)"> ${esc(row[3]||'')}${R?ok(R.m[i],fmt(row[1])+' '+esc(row[3]||'')):''}</td></tr>`});
    h+=`</table>`;
  }
  if(p.k==='tabcis'){
    h+=`<table class="tab"><tr><th>${esc(p.h0||'předloha')}</th>${p.cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr>`;
    p.rows.forEach(i=>{const row=p.r[i];h+=`<tr><td>${esc(row[0])}</td>`+p.cols.map((c,ci)=>{const k=i+'_'+ci;const v=a[k];
      return `<td><input ${dis} class="num" style="width:70px" inputmode="numeric" value="${v!=null?esc(v):''}" oninput="setT(${pi},'${k}',this.value)">${R?ok(R.m[k],String(row[ci+1])):''}</td>`}).join('')+`</tr>`});
    h+=`</table>`;
  }
  if(p.k==='grid'){
    h+=`<div class="imgs">`+p.g.map((gr,gi)=>`<div><b style="font-size:.9em">${esc(gr[0])}</b><table class="grid">`+gr[1].map((row,r)=>`<tr>`+row.map((v,c)=>{const k=gi+'_'+r+'_'+c;const val=a[k];
      const cls=R?(R.m[k]?'g-ok':'g-bad'):'';
      return `<td class="${cls} ${r===1?'dole':''}"><input ${dis} class="num" inputmode="numeric" style="${r===0?'transform:rotate(180deg)':''}" value="${val!=null?esc(val):''}" oninput="setT(${pi},'${k}',this.value)">${R&&!R.m[k]?`<div class="corr">${v}</div>`:''}</td>`}).join('')+`</tr>`).join('')+`</table></div>`).join('')+`</div>`;
  }
  if(p.k==='vysvetli'){
    if(Q.hint)h+=`<div class="hint">Napiš něco o: ${p.klice.map(x=>`<b>${esc(x[0])}</b>`).join(' · ')}</div>`;
    h+=`<textarea ${dis} rows="4" oninput="setT(${pi},'t',this.value)" placeholder="Napiš vlastními slovy…">${a.t?esc(a.t):''}</textarea>`;
    if(R){h+=`<div class="klice">`+p.klice.map((x,i)=>`<div>${R.m[i]?'<span class="znak ok">✔</span> zmínil/a jsi:':'<span class="znak bad">✘</span> chybí:'} ${esc(x[0])}</div>`).join('')+`</div><div class="vzor"><b>Vzorová odpověď:</b><br>${p.vzor}</div>`}
  }
  return h;
}

/* ---------- ukládání odpovědí ---------- */
function setA(pi,k,v,redraw){Q.A[pi][k]=v;if(redraw){const y=scrollY;kresli();scrollTo(0,y)}}
function setT(pi,k,v){if(v===''||v==null)delete Q.A[pi][k];else Q.A[pi][k]=v}
function setS(pi,k,el,f,n){const p=Q.parts[pi];const nab=n!=null?p[f][n]:p[f];if(el.value==='')delete Q.A[pi][k];else Q.A[pi][k]=nab[+el.value];el.className=el.value===''?'':'done'}

function napoveda(){Q.hint=true;
  // co už žák napsal, se při přepnutí na nabídku zahodí (u napis/napisN)
  Q.parts.forEach((p,pi)=>{if(p.k==='napis'||p.k==='napisN')Q.A[pi]={}});
  const y=scrollY;kresli();scrollTo(0,y)}

function prazdne(){let n=0;Q.parts.forEach((p,pi)=>{const a=Q.A[pi];if(!Object.keys(a).length)n++});return n}

function zkontrolovat(){
  if(prazdne()===Q.parts.length&&!confirm('Nic jsi nevyplnil/a. Chceš rovnou vidět správné řešení?'))return;
  Q.res=hodnotit(Q);
  const got=Q.res.reduce((a,x)=>a+x.got,0),max=Q.res.reduce((a,x)=>a+x.max,0),fr=max?got/max:0;
  const id=Q.item.id; const p=S.p[id]||{b:0,n:0,ok:0}; S.n++;
  if(fr===1)p.b=Q.hint?(p.b||0):Math.min(5,(p.b||0)+1);   // s nápovědou se „umím“ nezvyšuje
  else if(fr>=0.5)p.b=Math.max(0,(p.b||0)-1);
  else p.b=0;
  p.n++; if(fr===1)p.ok++; p.last=S.n; S.p[id]=p; ulozit();
  KOLA.vysl.push({it:Q.item,fr,hint:Q.hint,opak:Q.opak});
  // špatně → otázka přijde v tomto kole ještě jednou (s jinak zamíchanými možnostmi)
  if(fr<1&&!Q.opak&&KOLA.fronta.length<KOLO+5)KOLA.fronta.push({it:Q.item,opak:true});
  const y=scrollY;kresli();scrollTo(0,y);
}
function dalsi(){KOLA.i++;if(KOLA.i>=KOLA.fronta.length)konec();else otazka()}

function konec(){
  hlavicka('Konec kola');
  const V=KOLA?KOLA.vysl.filter(x=>!x.opak):[];
  const dobre=V.filter(x=>x.fr===1).length;
  let h=`<div class="card" style="text-align:center"><h1>Konec kola</h1>
    <p class="big">${dobre} / ${V.length}</p><p>otázek napoprvé <b>správně</b></p></div>`;
  if(V.length){h+=`<div class="card"><h2><span>Jak to šlo</span></h2><table class="tab">`+V.map(x=>`<tr><td>${x.fr===1?'<span class="znak ok">✔</span>':x.fr>=0.5?'<span class="znak pul">◐</span>':'<span class="znak bad">✘</span>'}</td><td>Ústní ${x.it.o}</td><td>${(x.it.q||x.it.t).replace(/<[^>]+>/g,'').slice(0,70)||'výpočet'}</td></tr>`).join('')+`</table></div>`}
  h+=`<div class="card"><h2><span>Co už umím</span></h2>`+S.temata.map(o=>{const u=umim(o);return `<div class="tema on"><span class="tn">${o}</span><span class="tt">${esc(TEMATA[o])}<span class="bar"><i style="width:${u}%;background:${u>=75?'var(--ok)':u>=40?'var(--warn)':'var(--acc)'}"></i></span></span><span class="tp">${u} %</span></div>`}).join('')+`</div>
  <div class="tl"><button class="btn velky" onclick="zacit()">▶ Další kolo</button> <button class="btn sec" onclick="domu()">🏠 Domů</button></div>`;
  KOLA=null; app.innerHTML=h; scrollTo(0,0);
}

function velikost(){const b=document.body,t=document.getElementById('bFs');
  S.fs=(S.fs+1)%3; ulozit(); nastavFs()}
function nastavFs(){const b=document.body,t=document.getElementById('bFs');b.classList.remove('velke','nejvetsi');
  if(S.fs===1)b.classList.add('velke');if(S.fs===2)b.classList.add('nejvetsi');t.textContent=['A+','A++','A'][S.fs]}

/* kontrola banky (pro autora) */
(function(){const ids=new Set();BANKA.forEach(it=>{if(ids.has(it.id))console.warn('Dvojí id',it.id);ids.add(it.id);
  if(it.t==='vysvetli'&&!it.klice)console.warn('Chybí klíče',it.id)})})();

nastavFs(); domu();
