<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Písemné testy – reprodukční grafik</title>
<style>
  body{margin:0;font-family:"Atkinson Hyperlegible","Segoe UI",Arial,sans-serif;font-size:18px;color:#1d2433;background:#f4f6fa;line-height:1.45}
  header{background:#1f5fbf;color:#fff;padding:18px 16px}
  header h1{margin:0;font-size:1.4em} header p{margin:4px 0 0;opacity:.9}
  .wrap{max-width:820px;margin:0 auto;padding:16px}
  .karty{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
  a.karta{display:block;background:#fff;border:2px solid #d9dee8;border-radius:14px;padding:18px;text-decoration:none;color:inherit}
  a.karta:hover{border-color:#1f5fbf;background:#eef4ff}
  .ik{font-size:2.2em} .karta b{display:block;font-size:1.1em;margin:6px 0 4px;color:#1f5fbf}
  .karta span{color:#5b6476;font-size:.9em}
</style>
</head>
<body>
<header><h1>Písemné testy</h1><p>Reprodukční grafik – příprava na písemnou zkoušku</p></header>
<div class="wrap">
  <div class="karty">
    <a class="karta" href="samotestovani/">
      <div class="ik">✍️</div>
      <b>Samotestování – příprava na písemné testy</b>
      <span>Ústní otázky 1–8 · píšeš, nebo vybíráš</span>
    </a>
  </div>
</div>
</body>
</html>
